"$id": https://events.jupyter.org/jupyterlab_command_toolkit/lab_command/v1
version: "1"
title: A JupyterLab Command to Execute
personal-data: true
description: |
  A JupyterLab Command to execute
type: object
required:
  - name
properties:
  name:
    type: string
  args:
    type: object
  requestId:
    type: string
    description: The unique identifier for a command request expecting a result
  client_id:
    type: string
    description: >
      Optional target web client id. When set, only the browser whose web
      client id matches executes the command; when absent, every browser
      executes it (broadcast).
