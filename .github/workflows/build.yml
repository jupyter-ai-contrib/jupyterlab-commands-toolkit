name: Build

on:
  push:
    branches: main
  pull_request:
    branches: '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Base Setup
      uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1

    - name: Install dependencies
      run: python -m pip install -U "jupyterlab>=4.0.0,<5"

    - name: Lint the extension
      run: |
        set -eux
        jlpm
        jlpm run lint:check

    - name: Build the extension
      run: |
        set -eux
        python -m pip install .[test]

        jupyter server extension list
        jupyter server extension list 2>&1 | grep -ie "jupyterlab_commands_toolkit.*OK"

        jupyter labextension list
        jupyter labextension list 2>&1 | grep -ie "jupyterlab-commands-toolkit.*OK"
        python -m jupyterlab.browser_check

    - name: Package the extension
      run: |
        set -eux

        pip install build
        python -m build
        pip uninstall -y "jupyterlab_commands_toolkit" jupyterlab

    - name: Upload extension packages
      uses: actions/upload-artifact@v4
      with:
        name: extension-artifacts
        path: dist/jupyterlab_commands_toolkit*
        if-no-files-found: error

  test_isolated:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        architecture: 'x64'
    - uses: actions/download-artifact@v4
      with:
        name: extension-artifacts
    - name: Install and Test
      run: |
        set -eux
        # Remove NodeJS, twice to take care of system and locally installed node versions.
        sudo rm -rf $(which node)
        sudo rm -rf $(which node)

        pip install "jupyterlab>=4.0.0,<5" jupyterlab_commands_toolkit*.whl


        jupyter server extension list
        jupyter server extension list 2>&1 | grep -ie "jupyterlab_commands_toolkit.*OK"

        jupyter labextension list
        jupyter labextension list 2>&1 | grep -ie "jupyterlab-commands-toolkit.*OK"
        python -m jupyterlab.browser_check --no-browser-test


  e2e:
    name: E2E tests / ${{ matrix.variant }}
    needs: build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Keyed on optional integrations (not RTC): the package rides on Jupyter
        # Events and is RTC-independent. Each variant maps to a nox session that
        # installs the matching extras into an isolated venv.
        include:
          - { variant: Default, env: default }
          - { variant: Chat integration, env: chat }
          - { variant: MCP integration, env: mcp }

    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Base Setup
      uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1

    - name: Download extension package
      uses: actions/download-artifact@v4
      with:
        name: extension-artifacts

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Install nox
      run: uv tool install nox

    - name: Restore browser cache
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/pw-browsers
        key: ${{ runner.os }}-${{ hashFiles('ui-tests/yarn.lock') }}

    # Transport-independent, so it runs once at the job level: jlpm needs a
    # bootstrap jupyterlab, and `playwright install-deps` needs sudo (not
    # available inside a nox venv). nox reuses this node_modules + browser cache.
    - name: Set up ui-tests deps + browser
      working-directory: ui-tests
      env:
        YARN_ENABLE_IMMUTABLE_INSTALLS: 0
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      run: |
        set -eux
        python -m pip install "jupyterlab>=4.0.0,<5"
        jlpm install
        jlpm playwright install-deps
        jlpm playwright install chromium

    - name: Run E2E suite (${{ matrix.variant }})
      run: |
        set -eux
        export E2E_WHEEL="$(pwd)/$(ls jupyterlab_commands_toolkit*.whl)"
        nox -s "e2e(env='${{ matrix.env }}')"

    - name: Upload Playwright Test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: jupyterlab_commands_toolkit-playwright-tests-${{ matrix.env }}
        path: |
          ui-tests/test-results
          ui-tests/playwright-report

  check_links:
    name: Check Links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1
      - uses: jupyterlab/maintainer-tools/.github/actions/check-links@v1
